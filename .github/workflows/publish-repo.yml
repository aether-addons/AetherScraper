name: Notify AetherRepo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-aetherrepo
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AetherRepo app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AETHER_APP_ID }}
          private-key: ${{ secrets.AETHER_APP_PRIVATE_KEY }}
          owner: aether-addons
          repositories: AetherRepo

      - name: Trigger AetherRepo publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api repos/aether-addons/AetherRepo/dispatches \
            -f event_type=source-updated \
            -f client_payload[repository]="$SOURCE_REPOSITORY" \
            -f client_payload[sha]="$SOURCE_SHA"

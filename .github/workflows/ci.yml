name: AetherScraper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate active Kodi add-ons
        run: python3 scripts/validate_addons.py .

      - name: Run tests
        env:
          PYTHONPATH: script.module.aetherscraper/lib:plugin.program.aetherscraper/resources/lib
        run: python3 -m pytest -q
